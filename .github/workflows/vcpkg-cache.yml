name: Vcpkg Binary Cache

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vcpkg-cache.yml"
      - "build.ps1"
      - "plugin/CMakeLists.txt"
      - "plugin/CMakePresets.json"
      - "plugin/vcpkg.json"
      - "plugin/vcpkg-configuration.json"
      - "plugin/vcpkg-triplets/*.cmake"

permissions:
  contents: read

concurrency:
  group: vcpkg-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-cache:
    name: Warm Windows vcpkg binary cache
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Build plugin dependencies
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          if (-not $env:VCPKG_ROOT -and $env:VCPKG_INSTALLATION_ROOT) {
            $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          }
          if (-not $env:VCPKG_ROOT -and (Test-Path -LiteralPath 'C:\vcpkg')) {
            $env:VCPKG_ROOT = 'C:\vcpkg'
          }
          ./build.ps1 -Configuration Release -SkipVcVars -ConfigurePreset windows-x64-cicd -BuildPreset windows-x64-release-cicd

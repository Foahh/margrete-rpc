name: Vcpkg Binary Cache

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vcpkg-cache.yml"
      - "build.ps1"
      - "plugin/CMakeLists.txt"
      - "plugin/CMakePresets.json"
      - "plugin/vcpkg.json"
      - "plugin/vcpkg-configuration.json"
      - "plugin/vcpkg-triplets/*.cmake"

permissions:
  contents: read

concurrency:
  group: vcpkg-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-cache:
    name: Warm Windows vcpkg binary cache
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Prepare vcpkg binary cache
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}\vcpkg-bincache
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - uses: actions/cache@v5
        id: vcpkg-cache
        with:
          path: ${{ runner.temp }}\vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('plugin/vcpkg.json', 'plugin/vcpkg-configuration.json', 'plugin/vcpkg-triplets/*.cmake', 'plugin/CMakePresets.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
      - name: Build plugin dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}\vcpkg-bincache
        run: |
          if (-not $env:VCPKG_ROOT -and $env:VCPKG_INSTALLATION_ROOT) {
            $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          }
          if (-not $env:VCPKG_ROOT -and (Test-Path -LiteralPath 'C:\vcpkg')) {
            $env:VCPKG_ROOT = 'C:\vcpkg'
          }
          ./build.ps1 -Configuration Release -SkipVcVars -ConfigurePreset windows-x64-cicd -BuildPreset windows-x64-release-cicd

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  client:
    name: Client package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck
        run: uv run pyright
      - name: Tests
        run: uv run pytest
      - name: Build distributions
        run: uv build
      - name: Check distributions
        run: uv run --with twine twine check dist/*
      - name: Verify wheel includes generated protobuf
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          required = (
              "margrete_rpc/_proto/__init__.py",
              "margrete_rpc/_proto/margrete/rpc/messages_pb2.py",
          )
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          missing = [path for path in required if path not in names]
          if missing:
              raise SystemExit(f"wheel missing generated protobuf: {missing}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  plugin:
    name: Plugin artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Format and lint
        working-directory: plugin
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Build, test, and stage plugin
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Test -Publish
      - name: Create release archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = "margrete_rpc-$tag-windows-x64.zip"
          Compress-Archive -Path publish\* -DestinationPath $archive -Force
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $archive
          "$($hash.Hash.ToLowerInvariant())  $archive" | Set-Content -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-release
          path: |
            margrete_rpc-${{ github.ref_name }}-windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [client, plugin]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: [client, plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: plugin-release
          path: release-assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            --verify-tag \
            --generate-notes

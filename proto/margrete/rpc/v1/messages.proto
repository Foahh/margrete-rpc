syntax = "proto3";

package margrete.rpc.v1;

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAVAILABLE = 1;
  ERROR_CODE_INVALID_ARGUMENT = 2;
  ERROR_CODE_FAILED_PRECONDITION = 3;
  ERROR_CODE_INTERNAL = 4;
}

message Envelope {
  uint64 request_id = 1;
  oneof body {
    PingRequest ping_request = 10;
    PingResponse ping_response = 11;
    GetCurrentTickRequest get_current_tick_request = 20;
    GetCurrentTickResponse get_current_tick_response = 21;
    ErrorResponse error_response = 100;
  }
}

message PingRequest {}

message PingResponse {
  string server_name = 1;
}

message GetCurrentTickRequest {}

message GetCurrentTickResponse {
  int32 tick = 1;
}

message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
}

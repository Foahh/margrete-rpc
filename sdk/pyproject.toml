[project]
name = "margrete-rpc"
version = "0.1.0"
description = "Python SDK for the Margrete RPC plugin"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "protobuf>=7.35.0,<8",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.39.6,<2",
    "pytest>=9.0.3,<10",
    "ruff>=0.15.16,<1",
]

[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margrete_rpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["**/margrete_rpc/_proto/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.basedpyright]
include = ["src/margrete_rpc"]
exclude = ["src/margrete_rpc/_proto"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportPrivateUsage = false

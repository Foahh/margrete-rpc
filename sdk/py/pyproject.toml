[project]
name = "margrete-rpc"
version = "0.1.0"
description = "Python SDK for the Margrete RPC plugin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "protobuf>=5.29,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margrete_rpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

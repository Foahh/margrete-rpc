[project]
name = "margrete-rpc"
version = "1.1.1"
description = "Python client package for the Margrete RPC plugin"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "protobuf>=7.35.1,<8",
    "pywin32>=312; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.83.0",
    "pyright>=1.1.411,<2",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.3,<1",
]

[build-system]
requires = ["hatchling>=1.32.0", "grpcio-tools>=1.83.0"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_proto.py"

[tool.hatch.build.targets.wheel]
packages = ["python/margrete_rpc"]
artifacts = [
    "python/margrete_rpc/_proto",
]

[tool.hatch.build.targets.wheel.sources]
"python" = ""

[tool.hatch.build.targets.sdist]
include = [
    "/python/margrete_rpc",
    "/proto",
    "/scripts",
    "/README.md",
]
exclude = [
    "/python/margrete_rpc/_proto",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["**/margrete_rpc/_proto/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["python/margrete_rpc"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "python/margrete_rpc/_proto", ".venv"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

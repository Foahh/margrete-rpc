[project]
name = "margrete-rpc"
version = "1.1.3"
description = "Python client package for the Margrete RPC plugin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typing-extensions>=4.4,<5",
    "protobuf>=7.36.2,<8",
    "pywin32>=312; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "tomli>=2; python_version < '3.11'",
    "grpcio-tools>=1.85.1",
    "pyright>=1.1.414,<2",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.3,<1",
]

[build-system]
requires = ["hatchling>=1.33.0", "grpcio-tools>=1.85.1"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_proto.py"

[tool.hatch.build.targets.wheel]
packages = ["python/margrete_rpc"]
artifacts = [
    "python/margrete_rpc/_proto",
]

[tool.hatch.build.targets.wheel.sources]
"python" = ""

[tool.hatch.build.targets.sdist]
include = [
    "/python/margrete_rpc",
    "/proto",
    "/scripts",
    "/README.md",
]
exclude = [
    "/python/margrete_rpc/_proto",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["**/margrete_rpc/_proto/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["python/margrete_rpc", "python/tests/typing"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "python/margrete_rpc/_proto", ".venv"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
